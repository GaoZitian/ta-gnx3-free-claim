# ============================================================
# ta.gnx3.cn 免费领取配置
# ============================================================
# 说明：
# - 站点免费福利区里的免费商品很多（还有各种优惠券类），
#   但只有下方 items 列出的商品在本脚本支持范围内，
#   其他的用不到，不做考虑。
# - 三个平台的全部免费商品都已列出，想换领什么，
#   把该平台的 tid 改成 items 里的另一个 tid 即可。
# - 标了 status: 暂不实现 的商品，脚本不领取（选中它会直接报错提示）。
# - 互斥规则（站点强制）：每天全局只能成功领取一个商品。
#   领取顺序 = priority 平台优先，失败自动降级到下一个平台。
# - priority 不填时默认取第一个平台（douyin）。

platforms:
  douyin:                          # 抖音（需要 TA_DOUYIN_INPUT = 作品链接）
    tid: 5564                      # ← 当前领取：作品点赞10-1万
    items:
      - {tid: 5564, name: 作品点赞10-1万,   amount: 10}
      - {tid: 5539, name: 作品收藏10-1万,   amount: 10}
      - {tid: 5540, name: 作品分享100-1万,  amount: 100}
      - {tid: 3140, name: 作品播放1千-10万, amount: 1000}

  kuaishou:                        # 快手（需要 TA_KUAISHOU_INPUT = 作品链接）
    tid: 2170                      # ← 当前领取：作品点赞10-1万
    items:
      - {tid: 2170, name: 作品点赞10-1万,   amount: 10}
      - {tid: 5570, name: 福利粉丝10-1万,   amount: 10}
      - {tid: 5535, name: 作品收藏10-1万,   amount: 10}
      - {tid: 5536, name: 作品播放1百-1万,  amount: 100}
      - {tid: 5537, name: 作品分享1百-1万,  amount: 100}

  qq:                              # QQ（需要 TA_QQ_INPUT = QQ号码）
    tid: 5542                      # ← 当前领取：名片赞1百-10万随机（5700 豪华代挂暂不实现）
    items:
      - {tid: 5700, name: 豪华代挂等级加速1天, status: 暂不实现}
      - {tid: 5542, name: 名片赞1百-10万随机}
      - {tid: 5379, name: 空间访客1百-10万随机}
      - {tid: 5186, name: 说说浏览量1百-100万随机, status: 暂不实现}

# 每天先领这个平台；领取失败自动降级到下一个已配置平台。
# priority 来源（优先级从高到低）：
#   1. 环境变量 TA_PRIORITY   ← GitHub Actions 用 repo variable 改，无需提交代码
#   2. 本行 priority         ← 本地默认用
#   3. 不填则取第一个平台（douyin）
priority: douyin
