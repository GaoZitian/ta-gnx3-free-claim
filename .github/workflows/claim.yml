name: ta-gnx3 free claim

on:
  schedule:
    # UTC 18:00 = 北京时间 02:00，每天一次。
    # 选 02:00 而不是 00:10：GitHub Actions 的 schedule 常见延迟 6-10 小时
    # （实测 6.1h/6.5h/9.6h），延迟只会往后推，02:00 起跑即使延迟 20h 仍
    # 落在同一天（00:10 起跑延迟超 24h 就会跨日）。配合 claim.py 内显式
    # UTC+8 的日期判定，无论正常还是延迟执行都只处理"当天"。
    - cron: '0 18 * * *'
  workflow_dispatch:          # 手动触发（默认完整执行；想只做 dry-run 测试把 DRY_RUN_ON_DISPATCH 设为 1）

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Restore cookie/state cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/cookies.json
            .cache/state.json
          key: ta-gnx3-cookies-${{ github.run_id }}
          restore-keys: |
            ta-gnx3-cookies-

      - name: Run
        env:
          # runner 系统时区默认 UTC；这里显式设为北京时间，双保险。
          # claim.py 内部也已用显式 UTC+8 计算"今天"，不依赖这个变量。
          TZ: Asia/Shanghai
          TA_USER: ${{ secrets.TA_USER }}
          TA_PASS: ${{ secrets.TA_PASS }}
          TA_PRIORITY: ${{ secrets.TA_PRIORITY }}
          TA_DOUYIN_INPUT: ${{ secrets.TA_DOUYIN_INPUT }}
          TA_KUAISHOU_INPUT: ${{ secrets.TA_KUAISHOU_INPUT }}
          TA_QQ_INPUT: ${{ secrets.TA_QQ_INPUT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WXPUSH_URL: ${{ secrets.WXPUSH_URL }}
          WXPUSH_TOKEN: ${{ secrets.WXPUSH_TOKEN }}
          WXPUSH_USERID: ${{ secrets.WXPUSH_USERID }}
          WXPUSH_TEMPLATE_ID: ${{ secrets.WXPUSH_TEMPLATE_ID }}
          WXPUSH_BASE_URL: ${{ secrets.WXPUSH_BASE_URL }}
          TA_DRY_RUN: ${{ vars.DRY_RUN_ON_DISPATCH }}
        run: python claim.py

      # 缓存 key 含 run_id，每次运行都会保存新缓存；
      # 下次运行靠 restore-keys 前缀匹配恢复最近一次的 cookie/state
      - name: Save cache (implicit by actions/cache post step)
        run: echo "cache saved by actions/cache post step"
